<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Minecraft King's Brawl — финальная версия</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #0a0f0a;
            font-family: 'Segoe UI', 'Courier New', monospace;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .game-container {
            max-width: 1300px;
            width: 100%;
            background: #1a1e18;
            border-radius: 48px;
            padding: 24px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.5);
            border: 1px solid #5e7a4a;
        }
        button {
            background: #4a3e2c;
            border: none;
            font-family: inherit;
            font-weight: bold;
            padding: 10px 24px;
            border-radius: 60px;
            color: #f7efc3;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.07s linear;
            box-shadow: 0 4px 0 #2a2218;
        }
        button:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #2a2218;
        }
        input {
            background: #2e2c22;
            border: 1px solid #b9a76b;
            padding: 10px 16px;
            border-radius: 40px;
            color: #fff0c0;
            font-size: 1rem;
            margin: 8px;
            width: 200px;
        }
        .panel {
            background: #25291ec9;
            backdrop-filter: blur(4px);
            border-radius: 32px;
            padding: 20px;
            margin-bottom: 20px;
        }
        h1, h2, h3 {
            color: #ffdfa5;
            text-align: center;
            margin: 0 0 16px 0;
            text-shadow: 2px 2px 0 #4a3a1a;
        }
        .card-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            margin: 20px 0;
        }
        .hero-card {
            background: #2d2b1f;
            border-radius: 24px;
            width: 170px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            border: 2px solid #aa8e54;
            transition: 0.1s;
        }
        .hero-card.selected {
            border: 3px solid #f5bc42;
            background: #46422e;
            transform: scale(0.98);
        }
        .hero-card img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            background: #1e1c12;
            border-radius: 40px;
            padding: 8px;
        }
        .field-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            background: #2c3024;
            padding: 20px;
            border-radius: 28px;
            margin: 15px 0;
        }
        .cell {
            aspect-ratio: 5 / 4;
            background: #5a533a;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 11px;
            color: #ffe0aa;
            border: 2px solid #c7a75b;
            cursor: pointer;
            transition: 0.05s linear;
            text-align: center;
            padding: 4px;
            position: relative;
        }
        .cell.owner-p1 { background: #2f6b2f; border-color: #a5e0a5; }
        .cell.owner-p2 { background: #8b3c2a; border-color: #ffb084; }
        .cell.selected-unit { box-shadow: 0 0 0 3px #ffcc44; }
        .cell.target-highlight { box-shadow: 0 0 0 3px #ff4444; }
        .cell.wall { background: #5e5a40; }
        .action-bar {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 20px 0;
        }
        .log-area {
            background: #0e120ccc;
            border-radius: 20px;
            padding: 12px;
            height: 130px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            color: #cbe5c2;
        }
        .turn-indicator {
            background: #00000099;
            display: inline-block;
            padding: 6px 24px;
            border-radius: 40px;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .king-panel {
            display: flex;
            justify-content: space-between;
            background: #1f231b;
            border-radius: 28px;
            padding: 12px;
            margin: 15px 0;
        }
        .ability-indicators {
            position: fixed;
            bottom: 30px;
            right: 30px;
            display: flex;
            gap: 20px;
            background: #000000aa;
            padding: 12px 20px;
            border-radius: 60px;
            backdrop-filter: blur(8px);
            z-index: 100;
            border: 1px solid #ffd966;
        }
        .ability-circle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #2a5a2a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 20px;
            color: white;
            text-shadow: 1px 1px 0 black;
            transition: 0.1s;
            box-shadow: 0 0 0 2px #ffd966;
        }
        .ability-circle.ready {
            background: #2a8c2a;
            box-shadow: 0 0 0 3px #aaffaa;
        }
        .ability-circle.cooldown {
            background: #8a2a2a;
            filter: grayscale(0.3);
        }
        .ability-letter {
            font-size: 24px;
            font-weight: bold;
        }
        .ability-cd {
            font-size: 14px;
            background: black;
            border-radius: 20px;
            padding: 2px 6px;
            margin-top: 2px;
        }
    </style>
</head>
<body>
<div class="game-container" id="app"></div>
<div id="abilityIndicators" style="display: none;" class="ability-indicators">
    <div class="ability-circle" id="indicatorQ">
        <div class="ability-letter">Q</div>
        <div class="ability-cd" id="cdQ">✓</div>
    </div>
    <div class="ability-circle" id="indicatorE">
        <div class="ability-letter">E</div>
        <div class="ability-cd" id="cdE">✓</div>
    </div>
</div>

<script>
    // ========== ДАННЫЕ ==========
    const ARCH = {
        redstone: { name: "Редстоун", role: "controller", hp: 24, atk: 6, img: "https://cdn.discordapp.com/attachments/1490683424631947354/1490683694703181988/c61ca776f00a0315.png", q: "Ловушка", e: "Перегрузка" },
        stone: { name: "Камень", role: "tank", hp: 32, atk: 4, img: "https://cdn.discordapp.com/attachments/1490683424631947354/1490683844947611881/a7cfebed71d0b0e9.png", q: "Провокация", e: "Стена" },
        book: { name: "Книжный", role: "support", hp: 22, atk: 5, img: "https://cdn.discordapp.com/attachments/1490683424631947354/1490683587886842027/9f962d3280145492.png", q: "Массхил", e: "Проклятие" },
        headset: { name: "Наушники", role: "buffer", hp: 24, atk: 5, img: "https://cdn.discordapp.com/attachments/1490683424631947354/1490683788878024834/08a0fbe9622563ab.png", q: "Ритм", e: "Волна" },
        darkness: { name: "Тьма", role: "vampire", hp: 28, atk: 6, img: "https://cdn.discordapp.com/attachments/1490683424631947354/1490684085750730772/456fd51ce1b6be2c.png", q: "Теневой шаг", e: "Пожирание" }
    };
    const KING_PASS = {
        redstone: { atk: 2, hp: 0 },
        stone: { atk: 0, hp: 8 },
        book: { atk: 1, hp: 4 },
        headset: { atk: 2, hp: 0 },
        darkness: { atk: 0, hp: 3 }
    };
    const KING_ACT = {
        redstone: "2 ловушки",
        stone: "щит +5 всем",
        book: "полный хил",
        headset: "+2 атаки команде",
        darkness: "воскрешение 50%"
    };

    // ========== КЛАССЫ ==========
    class Unit {
        constructor(arch, owner, id) {
            this.id = id || `${owner}_${arch}_${Date.now()}_${Math.random()}`;
            this.arch = arch;
            this.owner = owner;
            this.role = ARCH[arch].role;
            this.maxHp = ARCH[arch].hp;
            this.hp = this.maxHp;
            this.baseAtk = ARCH[arch].atk;
            this.atk = this.baseAtk;
            this.stunned = false;
            this.alive = true;
            this.cdQ = 0;
            this.cdE = 0;
            this.taunt = false;
            this.buffAtk = 0;
            this.shield = 0;
            this.dmgRed = (this.role === 'tank') ? 0.25 : 0;
        }
        takeDamage(amt) {
            let dmg = amt;
            if (this.shield > 0) { let block = Math.min(this.shield, dmg); this.shield -= block; dmg -= block; }
            if (this.dmgRed) dmg = Math.floor(dmg * 0.75);
            this.hp = Math.max(0, this.hp - dmg);
            if (this.hp === 0) this.alive = false;
            return dmg;
        }
        heal(v) { this.hp = Math.min(this.maxHp, this.hp + v); }
        applyStun() { this.stunned = true; }
        clearStun() { this.stunned = false; }
        reduceCD() { if(this.cdQ>0) this.cdQ--; if(this.cdE>0) this.cdE--; this.buffAtk=0; this.taunt=false; }
    }
    class Wall { constructor(x,y) { this.x=x; this.y=y; this.hp=10; } }
    class Trap { constructor(x,y) { this.x=x; this.y=y; this.trig=false; }
        activate(u) { if(this.trig) return false; this.trig=true; let r=Math.random()<0.5; if(r){ u.takeDamage(6); addLog(`Ловушка взорвалась: ${ARCH[u.arch].name} -6`); } else { u.applyStun(); addLog(`Ловушка оглушила ${ARCH[u.arch].name}`); } return true; }
    }

    // ========== СОСТОЯНИЕ ==========
    let state = {
        phase: "lobby",
        myId: null,
        myNick: "",
        p1: { nick: "", king: null, fighters: [], ready: false, map: Array(5).fill().map(()=>Array(5).fill(null)) },
        p2: { nick: "", king: null, fighters: [], ready: false, map: Array(5).fill().map(()=>Array(5).fill(null)) },
        turn: "p1",
        selectedCell: null,
        targetCell: null,
        battle: { p1Units: [], p2Units: [], p1King: null, p2King: null, walls: [], traps: [] },
        peer: null, conn: null, roomId: null, botMode: false,
        log: []
    };

    let root = document.getElementById("app");
    function addLog(m) { state.log.unshift(`[${new Date().toLocaleTimeString()}] ${m}`); if(state.log.length>20) state.log.pop(); renderLog(); if(state.conn?.open) state.conn.send({type:"log", msg:m}); }
    function renderLog() { let el=document.getElementById("logArea"); if(el) el.innerHTML=state.log.map(l=>`<div>📜 ${l}</div>`).join(''); }

    // ========== ХЕЛПЕРЫ ПОЛЯ ==========
    function getUnit(x,y) {
        if(state.phase!=="battle") return null;
        for(let u of state.battle.p1Units) if(u.alive && state.p1.map[x]?.[y]===u) return u;
        for(let u of state.battle.p2Units) if(u.alive && state.p2.map[x]?.[y]===u) return u;
        return null;
    }
    function getWall(x,y) { return state.battle.walls.find(w=>w.x===x && w.y===y && w.hp>0); }
    function getTrap(x,y) { return state.battle.traps.find(t=>t.x===x && t.y===y && !t.trig); }
    function isWalkable(x,y) { if(x<0||x>4||y<0||y>4) return false; if(getUnit(x,y)) return false; if(getWall(x,y)) return false; return true; }
    function dist(x1,y1,x2,y2) { return Math.max(Math.abs(x1-x2),Math.abs(y1-y2)); }
    function canAttack(att, tx, ty, ax, ay) { let d=dist(ax,ay,tx,ty); if(att.role==='tank') return d<=1; return d<=2; }
    function forcedTarget(att, ax, ay) {
        let enemies=[];
        for(let i=0;i<5;i++) for(let j=0;j<5;j++) { let u=getUnit(i,j); if(u && u.owner!==att.owner && u.alive && dist(ax,ay,i,j)<=1) enemies.push(u); }
        if(enemies.length===0) return null;
        let taunt=enemies.find(e=>e.taunt);
        if(taunt) return taunt;
        enemies.sort((a,b)=>dist(ax,ay,findPos(a).x,findPos(a).y)-dist(ax,ay,findPos(b).x,findPos(b).y));
        return enemies[0];
    }
    function findPos(unit) { for(let i=0;i<5;i++) for(let j=0;j<5;j++) if(state[unit.owner==='p1'?'p1':'p2'].map[i][j]===unit) return {x:i,y:j}; return null; }

    // анимации
    function animateHit(x,y) { let cells=document.querySelectorAll('.cell'); let idx=x*5+y; if(cells[idx]) { cells[idx].style.transform='scale(1.2)'; cells[idx].style.background='#aa4444'; setTimeout(()=>{ if(cells[idx]){ cells[idx].style.transform=''; cells[idx].style.background=''; } },200); } }
    function animateDmg(x,y,dmg) { let cells=document.querySelectorAll('.cell'); let parent=cells[x*5+y]; if(!parent) return; let div=document.createElement('div'); div.innerText=`-${dmg}`; div.style.position='absolute'; div.style.color='#ff8888'; div.style.fontWeight='bold'; div.style.transition='all 0.4s'; parent.appendChild(div); setTimeout(()=>{ div.style.transform='translateY(-20px)'; div.style.opacity='0'; },20); setTimeout(()=>div.remove(),500); }
    function animateDeath(x,y) { let cells=document.querySelectorAll('.cell'); let el=cells[x*5+y]; if(el){ el.style.transition='0.2s'; el.style.transform='scale(0)'; el.style.opacity='0'; setTimeout(()=>{ if(el){ el.style.transform=''; el.style.opacity=''; } },250); } }

    // ========== БОЕВЫЕ ДЕЙСТВИЯ ==========
    function performAttack(att, tx, ty) {
        let apos=findPos(att); if(!apos) return false;
        let target=getUnit(tx,ty); if(!target || target.owner===att.owner) return false;
        if(!canAttack(att,tx,ty,apos.x,apos.y)){ addLog("Слишком далеко"); return false; }
        let forced=forcedTarget(att,apos.x,apos.y);
        if(forced && forced!==target){ addLog("Обязан атаковать ближайшего врага"); return false; }
        let dmg=att.atk+att.buffAtk;
        let real=target.takeDamage(dmg);
        addLog(`${ARCH[att.arch].name} атакует ${ARCH[target.arch].name} на ${real} урона`);
        animateHit(tx,ty); animateDmg(tx,ty,real);
        if(!target.alive) animateDeath(tx,ty);
        if(att.role==='vampire') { let heal=Math.floor(real*0.5); att.heal(heal); addLog(`${ARCH[att.arch].name} восстановил ${heal}`); }
        return true;
    }

    function useSkill(att, tx, ty, slot) {
        let apos=findPos(att); if(!apos) return false;
        let targetUnit=getUnit(tx,ty);
        let cd=(slot==='Q')?att.cdQ:att.cdE;
        if(cd>0){ addLog(`Перезарядка ${cd} ходов`); return false; }
        if(Math.random()<0.25){ addLog("Промах!"); return true; }
        let arch=att.arch; let msg="";
        if(slot==='Q'){
            switch(arch){
                case 'redstone':
                    if(isWalkable(tx,ty) && !getTrap(tx,ty)){ state.battle.traps.push(new Trap(tx,ty)); msg="Ловушка поставлена"; att.cdQ=2; }
                    else msg="Нельзя поставить ловушку";
                    break;
                case 'stone':
                    for(let i=0;i<5;i++) for(let j=0;j<5;j++){ let u=getUnit(i,j); if(u && u.owner!==att.owner && u.alive && dist(apos.x,apos.y,i,j)<=1) u.taunt=true; }
                    msg="Провокация активирована"; att.cdQ=2;
                    break;
                case 'book':
                    let team=(att.owner==='p1')?state.battle.p1Units:state.battle.p2Units;
                    team.forEach(u=>{ if(u.alive) u.heal(4); });
                    msg="Массовое лечение +4"; att.cdQ=2;
                    break;
                case 'headset':
                    for(let i=0;i<5;i++) for(let j=0;j<5;j++){ let u=getUnit(i,j); if(u && u.owner===att.owner && u.alive && dist(apos.x,apos.y,i,j)<=1){ u.buffAtk+=1; u.extra=true; } }
                    msg="Ритм: +1 атака союзникам рядом"; att.cdQ=3;
                    break;
                case 'darkness':
                    let enemy=getUnit(tx,ty);
                    if(enemy && enemy.owner!==att.owner && dist(apos.x,apos.y,tx,ty)<=2){
                        for(let i=0;i<5;i++) for(let j=0;j<5;j++) if(state[att.owner==='p1'?'p1':'p2'].map[i][j]===att) state[att.owner==='p1'?'p1':'p2'].map[i][j]=null;
                        let moved=false;
                        for(let dx=-1;dx<=1;dx++) for(let dy=-1;dy<=1;dy++){ let nx=tx+dx, ny=ty+dy; if(nx>=0&&nx<5&&ny>=0&&ny<5 && isWalkable(nx,ny)){ state[att.owner==='p1'?'p1':'p2'].map[nx][ny]=att; moved=true; break; } }
                        if(!moved){ addLog("Нет места для телепорта"); return false; }
                        enemy.takeDamage(4); animateHit(tx,ty); animateDmg(tx,ty,4); if(!enemy.alive) animateDeath(tx,ty);
                        msg="Теневой шаг + удар 4"; att.cdQ=2;
                    } else msg="Нет врага рядом";
                    break;
            }
        } else {
            switch(arch){
                case 'redstone': att.buffAtk+=3; att.takeDamage(4); msg="Перегрузка +3 атаки, -4 себе"; att.cdE=3; break;
                case 'stone':
                    if(isWalkable(tx,ty) && !getWall(tx,ty)){ state.battle.walls.push(new Wall(tx,ty)); msg="Каменная стена (10 HP)"; att.cdE=3; }
                    else msg="Нельзя поставить стену";
                    break;
                case 'book':
                    let curse=getUnit(tx,ty);
                    if(curse && curse.owner!==att.owner){ curse.buffAtk-=2; curse.takeDamage(3); animateHit(tx,ty); animateDmg(tx,ty,3); if(!curse.alive) animateDeath(tx,ty); msg="Проклятие: -2 атаки, 3 урона"; att.cdE=3; }
                    else msg="Нет врага";
                    break;
                case 'headset':
                    let dx=Math.sign(tx-apos.x), dy=Math.sign(ty-apos.y);
                    let x=apos.x+dx, y=apos.y+dy; let hit=false;
                    while(x>=0 && x<5 && y>=0 && y<5){
                        let u=getUnit(x,y); if(u && u.owner!==att.owner){ u.takeDamage(5); animateHit(x,y); animateDmg(x,y,5); if(!u.alive) animateDeath(x,y); hit=true; }
                        x+=dx; y+=dy;
                    }
                    msg=hit?"Звуковая волна 5 урона по линии":"Никого не задело"; att.cdE=3;
                    break;
                case 'darkness':
                    let victim=getUnit(tx,ty);
                    if(victim && victim.owner!==att.owner){ let dmg=6; victim.takeDamage(dmg); att.heal(dmg); animateHit(tx,ty); animateDmg(tx,ty,dmg); if(!victim.alive) animateDeath(tx,ty); msg=`Пожирание: ${dmg} урона, лечение ${dmg}`; att.cdE=3; }
                    else msg="Нет врага";
                    break;
            }
        }
        addLog(msg);
        return true;
    }

    function useKingAbility() {
        let king = (state.turn==='p1')?state.battle.p1King:state.battle.p2King;
        if(!king) return;
        let act = KING_ACT[king.arch];
        addLog(`Король использует: ${act}`);
        if(act==="2 ловушки") for(let i=0;i<2;i++){ let free=[]; for(let a=0;a<5;a++) for(let b=0;b<5;b++) if(isWalkable(a,b)) free.push({x:a,y:b}); if(free.length){ let p=free[Math.floor(Math.random()*free.length)]; state.battle.traps.push(new Trap(p.x,p.y)); } }
        else if(act==="щит +5 всем"){ let team=(state.turn==='p1')?state.battle.p1Units:state.battle.p2Units; team.forEach(u=>u.shield+=5); }
        else if(act==="полный хил"){ let team=(state.turn==='p1')?state.battle.p1Units:state.battle.p2Units; let worst=team.reduce((a,b)=>a.hp/a.maxHp<b.hp/b.maxHp?a:b,team[0]); if(worst) worst.heal(worst.maxHp-worst.hp); }
        else if(act==="+2 атаки команде"){ let team=(state.turn==='p1')?state.battle.p1Units:state.battle.p2Units; team.forEach(u=>u.buffAtk+=2); }
        else if(act==="воскрешение 50%"){ let dead=(state.turn==='p1')?state.battle.p1Units.filter(u=>!u.alive):state.battle.p2Units.filter(u=>!u.alive); if(dead.length){ let rev=dead[0]; rev.alive=true; rev.hp=Math.floor(rev.maxHp*0.5); addLog(`${ARCH[rev.arch].name} воскрешён с 50% HP`); } }
        renderBattle();
    }

    function endTurn() {
        state.battle.p1Units.forEach(u=>u.reduceCD()); state.battle.p2Units.forEach(u=>u.reduceCD());
        state.turn = (state.turn==='p1')?'p2':'p1';
        addLog(`Ход переходит к ${state.turn==='p1'?state.p1.nick:state.p2.nick}`);
        sendSync();
        renderBattle();
        if(state.botMode && state.turn==='p2') setTimeout(()=>botTurn(), 400);
    }

    function checkWin() {
        let p1u=state.battle.p1Units.some(u=>u.alive), p2u=state.battle.p2Units.some(u=>u.alive);
        let p1k=state.battle.p1King?.alive, p2k=state.battle.p2King?.alive;
        if(!p1u || !p1k){ addLog(`${state.p2.nick} ПОБЕДА!`); resetGame(); return true; }
        if(!p2u || !p2k){ addLog(`${state.p1.nick} ПОБЕДА!`); resetGame(); return true; }
        return false;
    }

    function botTurn() {
        if(state.turn!=='p2') return;
        let units=state.battle.p2Units.filter(u=>u.alive);
        for(let u of units){
            let pos=findPos(u); if(!pos) continue;
            let enemies=state.battle.p1Units.filter(e=>e.alive);
            if(enemies.length===0) continue;
            let target=enemies.reduce((a,b)=>{ let pa=findPos(a), pb=findPos(b); return dist(pos.x,pos.y,pa.x,pa.y)<dist(pos.x,pos.y,pb.x,pb.y)?a:b; });
            let tpos=findPos(target);
            if(canAttack(u,tpos.x,tpos.y,pos.x,pos.y)){ performAttack(u,tpos.x,tpos.y); if(checkWin()) return; continue; }
            if(Math.random()<0.3){ useSkill(u,tpos.x,tpos.y,"Q"); if(checkWin()) return; continue; }
            let dx=Math.sign(tpos.x-pos.x), dy=Math.sign(tpos.y-pos.y);
            let nx=pos.x+dx, ny=pos.y+dy;
            if(isWalkable(nx,ny)){ state.p2.map[pos.x][pos.y]=null; state.p2.map[nx][ny]=u; let trap=getTrap(nx,ny); if(trap && trap.owner!=='p2') trap.activate(u); renderBattle(); }
        }
        endTurn();
    }

    // ========== СИНХРОНИЗАЦИЯ ==========
    function sendSync() { if(state.conn?.open) state.conn.send({type:"sync", data:serialize()}); }
    function serialize() { return { p1:state.p1, p2:state.p2, turn:state.turn, battle:{ p1Units:state.battle.p1Units.map(u=>({...u})), p2Units:state.battle.p2Units.map(u=>({...u})), p1King:state.battle.p1King?{...state.battle.p1King}:null, p2King:state.battle.p2King?{...state.battle.p2King}:null, walls:state.battle.walls, traps:state.battle.traps } }; }
    function reviveUnit(d) { if(!d) return null; let u=new Unit(d.arch, d.owner, d.id); Object.assign(u,d); return u; }
    function deserialize(data) { state.p1=data.p1; state.p2=data.p2; state.turn=data.turn; state.battle.p1Units=data.battle.p1Units.map(u=>reviveUnit(u)); state.battle.p2Units=data.battle.p2Units.map(u=>reviveUnit(u)); state.battle.p1King=reviveUnit(data.battle.p1King); state.battle.p2King=reviveUnit(data.battle.p2King); state.battle.walls=data.battle.walls; state.battle.traps=data.battle.traps; }
    function applyAction(act) { if(state.turn!==(state.myId==='p1'?'p2':'p1')) return; let attacker=getUnit(act.ax,act.ay); if(!attacker) return; state.selectedCell={x:act.ax,y:act.ay}; if(act.type==='attack') performAttack(attacker,act.tx,act.ty); else if(act.type==='skill') useSkill(attacker,act.tx,act.ty,act.slot); else if(act.type==='king') useKingAbility(); state.selectedCell=null; if(checkWin()) return; state.turn=(state.turn==='p1')?'p2':'p1'; sendSync(); renderBattle(); }

    // ========== ОТРИСОВКА ЭТАПОВ ==========
    function render() {
        if(state.phase==="lobby") renderLobby();
        else if(state.phase==="pick") renderPick();
        else if(state.phase==="placement") renderPlacement();
        else if(state.phase==="battle") renderBattle();
        updateAbilityIndicators();
    }
    function updateAbilityIndicators() {
        let divs=document.getElementById("abilityIndicators");
        if(state.phase==="battle" && state.selectedCell){
            let attacker=getUnit(state.selectedCell.x,state.selectedCell.y);
            if(attacker && attacker.alive){
                divs.style.display="flex";
                let qCircle=document.getElementById("indicatorQ");
                let eCircle=document.getElementById("indicatorE");
                let cdQdiv=document.getElementById("cdQ");
                let cdEdiv=document.getElementById("cdE");
                if(attacker.cdQ===0){ qCircle.classList.add("ready"); qCircle.classList.remove("cooldown"); cdQdiv.innerText="✓"; } else { qCircle.classList.remove("ready"); qCircle.classList.add("cooldown"); cdQdiv.innerText=attacker.cdQ; }
                if(attacker.cdE===0){ eCircle.classList.add("ready"); eCircle.classList.remove("cooldown"); cdEdiv.innerText="✓"; } else { eCircle.classList.remove("ready"); eCircle.classList.add("cooldown"); cdEdiv.innerText=attacker.cdE; }
                return;
            }
        }
        divs.style.display="none";
    }

    function renderLobby() {
        root.innerHTML=`<div class="panel"><h1>⚔️ MINECRAFT KING'S BRAWL</h1><div style="text-align:center"><input id="nick" placeholder="Ваш ник"><br><button id="createRoom">🌟 Создать комнату</button><input id="roomId" placeholder="ID комнаты"><button id="joinRoom">🔗 Подключиться</button><button id="botBtn">🤖 Играть с ботом</button></div><div class="log-area" id="logArea"></div></div>`;
        document.getElementById("createRoom")?.addEventListener("click",()=>{ let n=document.getElementById("nick").value.trim(); if(!n) return; state.myNick=n; let p=new Peer(); p.on("open",id=>{ state.peer=p; state.roomId=id; addLog(`Комната создана: ${id}`); p.on("connection",c=>setupConnection(c,true)); }); });
        document.getElementById("joinRoom")?.addEventListener("click",()=>{ let n=document.getElementById("nick").value.trim(); let rid=document.getElementById("roomId").value.trim(); if(!n||!rid) return; state.myNick=n; let p=new Peer(); p.on("open",()=>{ let c=p.connect(rid); setupConnection(c,false); }); });
        document.getElementById("botBtn")?.addEventListener("click",()=>{ let n=document.getElementById("nick").value.trim(); if(!n) return; state.myNick=n; state.myId="p1"; state.p1.nick=n; state.p2.nick="Bot"; state.botMode=true; state.phase="pick"; render(); });
        renderLog();
    }
    function setupConnection(conn, isHost) { state.conn=conn; state.myId=isHost?"p1":"p2"; state[state.myId].nick=state.myNick; conn.on("open",()=>{ state.phase="pick"; render(); }); conn.on("data",(d)=>{ if(d.type==="sync") deserialize(d.data); else if(d.type==="action") applyAction(d.action); else if(d.type==="log") addLog(d.msg); else if(d.type==="ready"){ state[d.playerId].ready=true; if(state.p1.ready && state.p2.ready) startPlacement(); } else if(d.type==="placement"){ state[d.playerId].map=d.map; if(bothPlaced()) startBattle(); } }); conn.on("close",()=>{ addLog("Потеря связи"); resetGame(); }); if(!isHost) conn.send({type:"init", nick:state.myNick}); }
    function startPlacement(){ state.phase="placement"; render(); }
    function bothPlaced(){ return state.p1.map.flat().some(u=>u) && state.p2.map.flat().some(u=>u); }
    function startBattle(){
        state.battle.p1Units=state.p1.map.flat().filter(u=>u);
        state.battle.p2Units=state.p2.map.flat().filter(u=>u);
        state.battle.p1King=new Unit(state.p1.king.arch,"p1","king"); state.battle.p1King.maxHp=40; state.battle.p1King.hp=40;
        state.battle.p2King=new Unit(state.p2.king.arch,"p2","king"); state.battle.p2King.maxHp=40; state.battle.p2King.hp=40;
        state.turn="p1"; state.phase="battle"; render(); if(state.botMode && state.turn==='p2') setTimeout(()=>botTurn(),300);
    }
    function renderPick() {
        let my=state[state.myId];
        root.innerHTML=`<div class="panel"><h2>Выбери КОРОЛЯ</h2><div id="kingGrid" class="card-grid"></div><h2>Выбери 3 бойцов</h2><div id="fightGrid" class="card-grid"></div><button id="readyPick">✅ ГОТОВ</button><div class="log-area" id="logArea"></div></div>`;
        let kingDiv=document.getElementById("kingGrid"), fightDiv=document.getElementById("fightGrid");
        for(let k of Object.keys(ARCH)){
            let card=document.createElement("div"); card.className="hero-card"; if(my.king?.arch===k) card.classList.add("selected");
            card.innerHTML=`<img src="${ARCH[k].img}"><div class="hero-name">👑 ${ARCH[k].name}</div><div class="hero-desc">Пассив: +${KING_PASS[k].atk} атаки, +${KING_PASS[k].hp} HP</div>`;
            card.onclick=()=>{ my.king={arch:k, ...KING_PASS[k]}; renderPick(); };
            kingDiv.appendChild(card);
            let fcard=document.createElement("div"); fcard.className="hero-card"; if(my.fighters.some(f=>f.arch===k)) fcard.classList.add("selected");
            fcard.innerHTML=`<img src="${ARCH[k].img}"><div class="hero-name">${ARCH[k].name}</div><div class="hero-desc">❤️${ARCH[k].hp} ⚔️${ARCH[k].atk}<br>🎯${ARCH[k].q} / ${ARCH[k].e}</div>`;
            fcard.onclick=()=>{ let arr=my.fighters; if(arr.some(f=>f.arch===k)) arr=arr.filter(f=>f.arch!==k); else if(arr.length<3) arr.push({arch:k}); my.fighters=arr; renderPick(); };
            fightDiv.appendChild(fcard);
        }
        document.getElementById("readyPick")?.addEventListener("click",()=>{ if(!my.king || my.fighters.length!==3) return; my.ready=true; if(state.conn) state.conn.send({type:"ready", playerId:state.myId}); if(state.botMode || (state.p1.ready && state.p2.ready)) startPlacement(); });
        renderLog();
    }
    function renderPlacement() {
        let myMap=state[state.myId].map;
        let isP1=state.myId==='p1';
        let rows=isP1?[0,1]:[3,4];
        root.innerHTML=`<div class="panel"><div class="field-grid" id="placeGrid"></div><button id="donePlace">✅ РАССТАВИТЬ</button><div class="log-area" id="logArea"></div></div>`;
        let grid=document.getElementById("placeGrid");
        for(let i=0;i<5;i++) for(let j=0;j<5;j++){
            let cell=document.createElement("div"); cell.className="cell"; let unit=myMap[i][j];
            if(unit) cell.innerHTML=`${ARCH[unit.arch].name}<br>❤️${unit.hp}`; else cell.innerHTML=".";
            if(rows.includes(i) && !unit) cell.onclick=()=>{
                let toPlaceArch = state[state.myId].fighters.find(f => !myMap.flat().some(cell => cell && cell.arch===f.arch));
                if(toPlaceArch){
                    let newUnit = new Unit(toPlaceArch.arch, state.myId, "fighter");
                    myMap[i][j] = newUnit;
                    renderPlacement();
                } else addLog("Нет неразмещённых бойцов");
            };
            grid.appendChild(cell);
        }
        document.getElementById("donePlace")?.addEventListener("click",()=>{ if(myMap.flat().filter(u=>u).length===3){ if(state.conn) state.conn.send({type:"placement", playerId:state.myId, map:myMap}); if(bothPlaced() || state.botMode) startBattle(); } else addLog("Нужно разместить 3 бойцов в своей зоне"); });
        renderLog();
    }
    function renderBattle() {
        let isMyTurn=(state.turn===state.myId) || (state.botMode && state.turn==='p1');
        root.innerHTML=`<div class="panel"><div class="turn-indicator">${isMyTurn?"⚡ ВАШ ХОД":"⏳ ХОД СОПЕРНИКА"}</div><div class="king-panel"><span>👑 ${state.p1.nick}: ❤️ ${state.battle.p1King?.hp||0}</span><span>👑 ${state.p2.nick}: ❤️ ${state.battle.p2King?.hp||0}</span></div><div class="field-grid" id="battleGrid"></div><div id="actionPanel" class="action-bar"></div><div class="log-area" id="logArea"></div></div>`;
        let grid=document.getElementById("battleGrid");
        for(let i=0;i<5;i++) for(let j=0;j<5;j++){
            let cell=document.createElement("div"); cell.className="cell"; let u=getUnit(i,j); let w=getWall(i,j); let t=getTrap(i,j);
            if(u){ cell.classList.add(`owner-${u.owner}`); cell.innerHTML=`${ARCH[u.arch].name}<br>❤️${u.hp}`; if(u.stunned) cell.innerHTML+="<br>💫"; }
            else if(w){ cell.classList.add("wall"); cell.innerHTML=`🧱${w.hp}`; }
            else if(t && t.owner!==state.myId) cell.innerHTML="⚠️";
            else cell.innerHTML=".";
            if(state.selectedCell?.x===i && state.selectedCell?.y===j) cell.classList.add("selected-unit");
            if(state.targetCell?.x===i && state.targetCell?.y===j) cell.classList.add("target-highlight");
            cell.onclick=()=>{ if(!isMyTurn) return; let unit=getUnit(i,j); if(unit && unit.owner===state.myId){ state.selectedCell={x:i,y:j}; state.targetCell=null; renderBattle(); } else if(state.selectedCell){ state.targetCell={x:i,y:j}; renderBattle(); } };
            grid.appendChild(cell);
        }
        let actDiv=document.getElementById("actionPanel");
        if(isMyTurn && state.selectedCell){
            let attacker=getUnit(state.selectedCell.x,state.selectedCell.y);
            if(attacker && attacker.alive && !attacker.stunned){
                actDiv.innerHTML=`<button id="atkBtn">⚔️ АТАКА</button><button id="qBtn">🔮 Q (${ARCH[attacker.arch].q})</button><button id="eBtn">🎧 E (${ARCH[attacker.arch].e})</button><button id="kingActBtn">👑 КОРОЛЬ</button><button id="endBtn">⏩ ЗАВЕРШИТЬ ХОД</button>`;
                document.getElementById("atkBtn")?.addEventListener("click",()=>{ if(state.targetCell){ performAttack(attacker,state.targetCell.x,state.targetCell.y); if(state.conn) state.conn.send({type:"action",action:{type:"attack",ax:state.selectedCell.x,ay:state.selectedCell.y,tx:state.targetCell.x,ty:state.targetCell.y}}); if(checkWin()) return; state.selectedCell=null; state.targetCell=null; renderBattle(); } });
                document.getElementById("qBtn")?.addEventListener("click",()=>{ if(state.targetCell){ useSkill(attacker,state.targetCell.x,state.targetCell.y,"Q"); if(state.conn) state.conn.send({type:"action",action:{type:"skill",slot:"Q",ax:state.selectedCell.x,ay:state.selectedCell.y,tx:state.targetCell.x,ty:state.targetCell.y}}); if(checkWin()) return; state.selectedCell=null; state.targetCell=null; renderBattle(); } });
                document.getElementById("eBtn")?.addEventListener("click",()=>{ if(state.targetCell){ useSkill(attacker,state.targetCell.x,state.targetCell.y,"E"); if(state.conn) state.conn.send({type:"action",action:{type:"skill",slot:"E",ax:state.selectedCell.x,ay:state.selectedCell.y,tx:state.targetCell.x,ty:state.targetCell.y}}); if(checkWin()) return; state.selectedCell=null; state.targetCell=null; renderBattle(); } });
                document.getElementById("kingActBtn")?.addEventListener("click",()=>{ useKingAbility(); if(state.conn) state.conn.send({type:"action",action:{type:"king"}}); renderBattle(); });
                document.getElementById("endBtn")?.addEventListener("click",()=>{ endTurn(); });
            } else actDiv.innerHTML=`<span>⚠️ Боец оглушён или мёртв</span>`;
        } else if(isMyTurn && !state.selectedCell) actDiv.innerHTML=`<span>🔍 Кликни по своему бойцу</span>`;
        renderLog();
        updateAbilityIndicators();
    }
    function resetGame() { state.phase="lobby"; state.p1={ nick:"", king:null, fighters:[], ready:false, map:Array(5).fill().map(()=>Array(5).fill(null)) }; state.p2={...state.p1}; state.battle={p1Units:[],p2Units:[],p1King:null,p2King:null,walls:[],traps:[]}; state.selectedCell=null; state.targetCell=null; state.botMode=false; if(state.conn){ state.conn.close(); state.conn=null; } render(); }
    render();
</script>
</body>
</html>
