<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Minecraft King's Brawl | Полная тактическая версия</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #0a0c0a;
            font-family: 'Courier New', 'Minecraft', 'Segoe UI', monospace;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: radial-gradient(rgba(30, 40, 20, 0.6) 2px, transparent 2px);
            background-size: 24px 24px;
        }

        .game-container {
            max-width: 1300px;
            width: 100%;
            background: #1e1f1c;
            border-radius: 32px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
            border: 1px solid #4a3f2c;
        }

        .debug-panel {
            background: #0b0e0a;
            border: 1px solid #5e5a3c;
            border-radius: 20px;
            padding: 12px 18px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #aaf0c0;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            font-family: monospace;
        }

        .log-area {
            background: #030504c9;
            border-radius: 16px;
            padding: 8px 12px;
            max-height: 140px;
            overflow-y: auto;
            font-size: 12px;
            font-family: monospace;
            width: 100%;
            backdrop-filter: blur(2px);
            margin-top: 15px;
        }

        .log-entry {
            border-left: 3px solid #6a9c3e;
            padding-left: 8px;
            margin: 4px 0;
            color: #cfe8cf;
        }

        .card-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            justify-content: center;
            margin: 20px 0;
        }

        .hero-card {
            background: #2d2b21;
            border-radius: 20px;
            width: 180px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            border: 2px solid #6b5a3a;
            transition: 0.1s linear;
            box-shadow: 0 6px 0 #19170e;
        }

        .hero-card.selected {
            border: 3px solid #f5c542;
            background: #3e3a2a;
            transform: scale(0.98);
        }

        .hero-card img {
            width: 90px;
            height: 90px;
            image-rendering: crisp-edges;
            background: #1e1b12;
            border-radius: 20px;
            padding: 5px;
            object-fit: contain;
        }

        .hero-name {
            font-weight: bold;
            color: #f0e6a0;
            margin: 8px 0 4px;
        }

        .hero-desc {
            font-size: 11px;
            color: #bbb082;
        }

        button {
            background: #3f3a2a;
            border: none;
            font-family: inherit;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 40px;
            color: #f9f2cf;
            font-size: 16px;
            cursor: pointer;
            transition: 0.07s linear;
            box-shadow: 0 4px 0 #1e1b0e;
        }

        button:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #1e1b0e;
        }

        .field-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            background: #2b2a20;
            padding: 20px;
            border-radius: 28px;
            margin: 15px 0;
        }

        .cell {
            aspect-ratio: 5 / 4;
            background: #3d3a2a;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 11px;
            color: #f2e1a0;
            border: 2px solid #6a5e3a;
            transition: 0.05s linear;
            cursor: pointer;
            text-shadow: 0 0 3px black;
            position: relative;
            text-align: center;
            padding: 4px;
        }

        .cell.owner-0 { background: #2f6b2f; border-color: #9ed96e; }
        .cell.owner-1 { background: #8b3c2a; border-color: #e69d6e; }
        .cell.selected-unit { box-shadow: 0 0 0 3px #ffcc44, inset 0 0 0 2px #ffdd77; }
        .cell.target-highlight { box-shadow: 0 0 0 3px #ff4444, inset 0 0 0 2px #ff8888; }
        .cell.wall-cell { background: #55503b; border-color: #bc9a5a; position: relative; }
        .cell.wall-cell::after { content: "🧱"; font-size: 20px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); opacity: 0.8; }

        .action-bar {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .skill-btn {
            background: #2d2b1a;
            padding: 12px 24px;
            font-size: 18px;
            min-width: 140px;
            position: relative;
        }
        .skill-btn.cooldown::after {
            content: attr(data-cd);
            position: absolute;
            top: -8px;
            right: -8px;
            background: #aa3333;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
        }

        .king-panel {
            background: #181e12;
            border-radius: 32px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .turn-indicator {
            background: #7a6a3a;
            display: inline-block;
            padding: 6px 18px;
            border-radius: 40px;
            margin-bottom: 15px;
        }
        .info-text { color: #d4c97a; font-size: 14px; margin: 8px 0; }
        input { background: #2a2a1c; border: 1px solid #aa9966; padding: 8px; border-radius: 30px; color: #ffefc0; margin: 5px; }
    </style>
</head>
<body>
<div class="game-container" id="gameRoot"></div>

<script>
    // ---------- АРХЕТИПЫ (НОВЫЕ СПОСОБНОСТИ ПОЛНОСТЬЮ) ----------
    const ARCH = {
        redstone: { name: "Редстоун", role: "controller", hp: 24, attack: 6, img: "https://cdn.discordapp.com/attachments/1490683424631947354/1490683694703181988/c61ca776f00a0315.png?ex=69d4f2e0&is=69d3a160&hm=4182ba5d5aa1e290bc7e33b77f4d71c7337f4737b6da8fd7f6615fae26707829&", skillQ: "Скрытая ловушка", skillE: "Перегрузка" },
        stone: { name: "Камень", role: "tank", hp: 32, attack: 4, img: "https://cdn.discordapp.com/attachments/1490683424631947354/1490683844947611881/a7cfebed71d0b0e9.png?ex=69d4f304&is=69d3a184&hm=f0a0e4995630eb62742afc9fd3d13cbe5b9d85e261897eba286378784b16d162&", skillQ: "Провокация", skillE: "Каменная стена" },
        book: { name: "Книжный", role: "support", hp: 22, attack: 5, img: "https://cdn.discordapp.com/attachments/1490683424631947354/1490683587886842027/9f962d3280145492.png?ex=69d4f2c6&is=69d3a146&hm=0fdab9a2b2cb4f81849f98934b99e54bbedc486756252b6fb47bf8e28bbea25e&", skillQ: "Массовое лечение", skillE: "Проклятие знания" },
        headset: { name: "Наушники", role: "buffer", hp: 24, attack: 5, img: "https://cdn.discordapp.com/attachments/1490683424631947354/1490683788878024834/08a0fbe9622563ab.png?ex=69d4f2f6&is=69d3a176&hm=f1053cfee7f783bf840d8a14f31ab57675f3fd09a1bb0238e6a84b6bd4345c30&", skillQ: "Ритм", skillE: "Звуковая волна" },
        darkness: { name: "Тьма", role: "vampire", hp: 28, attack: 6, img: "https://cdn.discordapp.com/attachments/1490683424631947354/1490684085750730772/456fd51ce1b6be2c.png?ex=69d4f33d&is=69d3a1bd&hm=2e663d696ff3f56af89234027b8f76c1667fb65e3401df6d07cc54945f358f30&", skillQ: "Теневой шаг", skillE: "Пожирание" }
    };

    const KING_PASSIVES = {
        redstone: { bonusAtk: 2, bonusHp: 0, desc: "Редстоуны +2 атаки" },
        stone: { bonusAtk: 0, bonusHp: 8, desc: "Каменные +8 HP и -20% урона" },
        book: { bonusAtk: 1, bonusHp: 4, desc: "Книжные +1 атака, +4 HP" },
        headset: { bonusAtk: 2, bonusHp: 0, desc: "Наушники +2 атаки" },
        darkness: { bonusAtk: 0, bonusHp: 3, desc: "Тьма реген 2 в ход" }
    };

    // Активные способности королей
    const KING_ACTIVES = {
        redstone: "Ставит 2 ловушки сразу",
        stone: "Щит +5 всем союзникам",
        book: "Полный хил одного юнита",
        headset: "Вся команда +2 атаки на ход",
        darkness: "Воскрешает юнита с 50% HP"
    };

    // ---------- КЛАСС ЮНИТА (с поддержкой статусов, ловушек, стен) ----------
    class Unit {
        constructor(archetype, owner, idSuffix, kingBonus = { bonusAtk:0, bonusHp:0 }) {
            this.id = `${owner}_${archetype}_${idSuffix}_${Date.now()}_${Math.random()}`;
            this.archetype = archetype;
            this.owner = owner;
            this.role = ARCH[archetype].role;
            this.baseHp = ARCH[archetype].hp + (kingBonus.bonusHp || 0);
            this.hp = this.baseHp;
            this.baseAttack = ARCH[archetype].attack + (kingBonus.bonusAtk || 0);
            this.attack = this.baseAttack;
            this.stunned = false;
            this.alive = true;
            this.cooldownQ = 0;
            this.cooldownE = 0;
            this.tauntActive = false;      // провокация
            this.buffAttack = 0;
            this.shield = 0;                // дополнительный щит
            this.extraAction = false;       // дополнительное действие от ритма
            this.damageReduction = (this.role === 'tank') ? 0.25 : 0;
        }
        takeDamage(amount) {
            let actual = amount;
            if (this.shield > 0) {
                let blocked = Math.min(this.shield, actual);
                this.shield -= blocked;
                actual -= blocked;
                addLog(`${ARCH[this.archetype].name} щит поглотил ${blocked} урона`, false);
            }
            if (this.damageReduction > 0) actual = Math.floor(actual * (1 - this.damageReduction));
            this.hp = Math.max(0, this.hp - actual);
            if (this.hp <= 0) this.alive = false;
            return actual;
        }
        heal(amount) { this.hp = Math.min(this.baseHp, this.hp + amount); }
        applyStun() { this.stunned = true; }
        clearStun() { this.stunned = false; }
        reduceCooldowns() {
            if (this.cooldownQ > 0) this.cooldownQ--;
            if (this.cooldownE > 0) this.cooldownE--;
            this.extraAction = false;
            this.buffAttack = 0;
            this.tauntActive = false;
        }
    }

    // Стена (препятствие)
    class Wall {
        constructor(x, y, owner) { this.x = x; this.y = y; owner; this.hp = 10; this.isWall = true; }
        takeDamage(amount) { this.hp -= amount; return this.hp <= 0; }
    }

    // Ловушка
    class Trap {
        constructor(x, y, owner) { this.x = x; this.y = y; owner; this.triggered = false; }
        activate(unit) {
            if (this.triggered) return false;
            this.triggered = true;
            let dmgOrStun = Math.random() < 0.5;
            if (dmgOrStun) {
                unit.takeDamage(6);
                addLog(`Ловушка взорвалась! ${ARCH[unit.archetype].name} получает 6 урона.`, false);
            } else {
                unit.applyStun();
                addLog(`Ловушка оглушила ${ARCH[unit.archetype].name} на 1 ход!`, false);
            }
            return true;
        }
    }

    // ---------- ГЛОБАЛЬНОЕ СОСТОЯНИЕ ----------
    let state = {
        phase: "lobby", // lobby, pickCards, placement, battle
        myPlayerId: null, // 'p1' или 'p2'
        myNick: "",
        players: {
            p1: { nick: "", king: null, fighters: [], ready: false, placementMap: Array(5).fill().map(() => Array(5).fill(null)) },
            p2: { nick: "", king: null, fighters: [], ready: false, placementMap: Array(5).fill().map(() => Array(5).fill(null)) }
        },
        turn: "p1",
        selectedCellPos: null,    // {x,y} свой боец
        targetCellPos: null,       // {x,y} враг или клетка для способности
        battleUnits: { p1Units: [], p2Units: [], p1King: null, p2King: null, walls: [], traps: [] },
        peer: null,
        conn: null,
        roomId: null,
        log: []
    };

    let root = document.getElementById("gameRoot");

    function addLog(msg, isError = false) {
        state.log.unshift(`[${new Date().toLocaleTimeString()}] ${msg}`);
        if (state.log.length > 25) state.log.pop();
        renderLog();
        if (state.conn && state.conn.open) state.conn.send({ type: "log", msg: msg });
    }

    function renderLog() {
        let logDiv = document.getElementById("debugLog");
        if (logDiv) {
            logDiv.innerHTML = state.log.map(l => `<div class="log-entry">${l}</div>`).join('');
        }
    }

    // ---------- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ПОЛЯ ----------
    function getUnitAt(x, y) {
        if (state.phase !== "battle") return null;
        for (let u of state.battleUnits.p1Units) if (u.alive && state.players.p1.placementMap[x] && state.players.p1.placementMap[x][y] === u) return u;
        for (let u of state.battleUnits.p2Units) if (u.alive && state.players.p2.placementMap[x] && state.players.p2.placementMap[x][y] === u) return u;
        return null;
    }

    function getWallAt(x, y) { return state.battleUnits.walls.find(w => w.x === x && w.y === y && w.hp > 0); }
    function getTrapAt(x, y) { return state.battleUnits.traps.find(t => t.x === x && t.y === y && !t.triggered); }

    function isWalkable(x, y, forPlayer) {
        if (x<0 || x>4 || y<0 || y>4) return false;
        if (getUnitAt(x,y)) return false;
        if (getWallAt(x,y)) return false;
        return true;
    }

    function getDistance(x1,y1,x2,y2) { return Math.max(Math.abs(x1-x2), Math.abs(y1-y2)); }

    function isValidAttackRange(attacker, targetX, targetY, attackerX, attackerY) {
        let dist = getDistance(attackerX, attackerY, targetX, targetY);
        if (attacker.role === 'tank') return dist <= 1;
        return dist <= 2;
    }

    function getForcedTarget(attacker, attackerX, attackerY) {
        let enemies = [];
        for (let i=0;i<5;i++) for(let j=0;j<5;j++) {
            let u = getUnitAt(i,j);
            if (u && u.owner !== attacker.owner && u.alive && getDistance(attackerX,attackerY,i,j) <= 1) enemies.push(u);
        }
        if (enemies.length === 0) return null;
        let taunt = enemies.find(e => e.tauntActive);
        return taunt || enemies[0];
    }

    // ---------- ЛОГИКА СПОСОБНОСТЕЙ (НОВЫЕ МЕХАНИКИ) ----------
    function useAbility(attacker, targetX, targetY, slot) {
        if (attacker.stunned) { addLog(`${ARCH[attacker.archetype].name} оглушён!`); return false; }
        let attackerPos = state.selectedCellPos;
        if (!attackerPos) return false;
        // проверка дистанции для способностей (кроме телепорта/ловушек)
        let dist = getDistance(attackerPos.x, attackerPos.y, targetX, targetY);
        if (slot === 'Q' && attacker.archetype === 'darkness') {
            // теневой шаг: телепорт в любую клетку рядом с врагом (проверка позже)
        } else if (slot === 'E' && attacker.archetype === 'headset') {
            // звуковая волна - линия, отдельная проверка
        } else {
            if (dist > 2 && attacker.role !== 'tank') { addLog("Слишком далеко для способности"); return false; }
            if (dist > 1 && attacker.role === 'tank') { addLog("Танк может использовать способности только рядом"); return false; }
        }

        let forced = getForcedTarget(attacker, attackerPos.x, attackerPos.y);
        let targetUnit = getUnitAt(targetX, targetY);
        if (forced && targetUnit !== forced && slot !== 'Q' && attacker.archetype !== 'redstone') {
            addLog("Вы обязаны атаковать ближайшего врага!");
            return false;
        }

        let cd = (slot === 'Q') ? attacker.cooldownQ : attacker.cooldownE;
        if (cd > 0) { addLog(`Способность перезарядится через ${cd} ходов`); return false; }

        let chance = 0.75;
        let success = Math.random() < chance;
        if (!success) { addLog(`${ARCH[attacker.archetype].name} промахнулся!`); return true; } // ход не тратится? тратим для баланса

        let arch = attacker.archetype;
        let msg = "";
        if (slot === 'Q') {
            switch(arch) {
                case 'redstone': // поставить ловушку
                    if (isWalkable(targetX, targetY, attacker.owner) && !getTrapAt(targetX,targetY)) {
                        state.battleUnits.traps.push(new Trap(targetX, targetY, attacker.owner));
                        msg = `Поставлена скрытая ловушка на (${targetX+1},${targetY+1})`;
                        attacker.cooldownQ = 2;
                    } else msg = "Нельзя поставить ловушку здесь!";
                    break;
                case 'stone': // провокация
                    for (let i=0;i<5;i++) for(let j=0;j<5;j++) {
                        let u = getUnitAt(i,j);
                        if (u && u.owner !== attacker.owner && u.alive && getDistance(attackerPos.x,attackerPos.y,i,j) <= 1) {
                            u.tauntActive = true;
                        }
                    }
                    msg = "Провокация: враги рядом обязаны атаковать вас!";
                    attacker.cooldownQ = 2;
                    break;
                case 'book': // массовое лечение
                    for (let u of (attacker.owner === 'p1' ? state.battleUnits.p1Units : state.battleUnits.p2Units)) {
                        if (u.alive) u.heal(4);
                    }
                    msg = "Все союзники восстановили 4 HP";
                    attacker.cooldownQ = 2;
                    break;
                case 'headset': // ритм
                    for (let i=0;i<5;i++) for(let j=0;j<5;j++) {
                        let u = getUnitAt(i,j);
                        if (u && u.owner === attacker.owner && u.alive && getDistance(attackerPos.x,attackerPos.y,i,j) <= 1) {
                            u.buffAttack += 1;
                            u.extraAction = true;
                        }
                    }
                    msg = "Ритм: союзники рядом +1 атака и доп. действие";
                    attacker.cooldownQ = 3;
                    break;
                case 'darkness': // теневой шаг
                    let targetEnemy = getUnitAt(targetX, targetY);
                    if (targetEnemy && targetEnemy.owner !== attacker.owner && getDistance(attackerPos.x,attackerPos.y,targetX,targetY) <= 2) {
                        // телепорт к врагу
                        for (let i=0;i<5;i++) for(let j=0;j<5;j++) {
                            if (state.players[attacker.owner].placementMap[i][j] === attacker) {
                                state.players[attacker.owner].placementMap[i][j] = null;
                                break;
                            }
                        }
                        let newX = targetX, newY = targetY;
                        // ищем свободную клетку рядом с врагом
                        let moved = false;
                        for (let dx=-1;dx<=1;dx++) for(let dy=-1;dy<=1;dy++) {
                            let nx = targetX+dx, ny = targetY+dy;
                            if (nx>=0 && nx<5 && ny>=0 && ny<5 && isWalkable(nx,ny,attacker.owner)) {
                                state.players[attacker.owner].placementMap[nx][ny] = attacker;
                                moved = true; break;
                            }
                        }
                        if (!moved) { addLog("Нет места для телепорта"); return false; }
                        targetEnemy.takeDamage(4);
                        msg = "Теневой шаг: телепорт и удар 4 урона";
                    } else { addLog("Нет врага рядом для теневого шага"); return false; }
                    attacker.cooldownQ = 2;
                    break;
                default: msg = "Способность не реализована";
            }
        } else { // E способность
            switch(arch) {
                case 'redstone':
                    attacker.buffAttack += 3;
                    attacker.takeDamage(4);
                    msg = "Перегрузка: +3 атаки на 2 хода, но 4 урона себе";
                    attacker.cooldownE = 3;
                    break;
                case 'stone':
                    if (isWalkable(targetX, targetY, attacker.owner) && !getWallAt(targetX,targetY)) {
                        state.battleUnits.walls.push(new Wall(targetX, targetY, attacker.owner));
                        msg = `Каменная стена (10 HP) на (${targetX+1},${targetY+1})`;
                    } else msg = "Нельзя поставить стену здесь";
                    attacker.cooldownE = 3;
                    break;
                case 'book':
                    let enemy = getUnitAt(targetX, targetY);
                    if (enemy && enemy.owner !== attacker.owner) {
                        enemy.buffAttack -= 2;
                        enemy.takeDamage(3);
                        msg = "Проклятие знания: -2 атаки и 3 урона";
                    } else msg = "Нет врага для проклятия";
                    attacker.cooldownE = 3;
                    break;
                case 'headset': // звуковая волна (линия)
                    let dx = Math.sign(targetX - attackerPos.x);
                    let dy = Math.sign(targetY - attackerPos.y);
                    let x = attackerPos.x, y = attackerPos.y;
                    let hit = false;
                    while (x>=0 && x<5 && y>=0 && y<5) {
                        x += dx; y += dy;
                        if (x<0 || x>=5 || y<0 || y>=5) break;
                        let u = getUnitAt(x,y);
                        if (u && u.owner !== attacker.owner) { u.takeDamage(5); hit = true; }
                    }
                    msg = hit ? "Звуковая волна нанесла 5 урона по линии" : "Волна никого не задела";
                    attacker.cooldownE = 3;
                    break;
                case 'darkness': // пожирание
                    let victim = getUnitAt(targetX, targetY);
                    if (victim && victim.owner !== attacker.owner) {
                        let dmg = 6;
                        victim.takeDamage(dmg);
                        attacker.heal(dmg);
                        msg = `Пожирание: ${dmg} урона, лечение ${dmg}`;
                    } else msg = "Нет врага для пожирания";
                    attacker.cooldownE = 3;
                    break;
                default: msg = "Способность E не реализована";
            }
        }
        addLog(msg);
        return true;
    }

    // Атака
    function performAttack(attacker, targetX, targetY) {
        if (attacker.stunned) { addLog(`${ARCH[attacker.archetype].name} оглушён!`); return false; }
        let attackerPos = state.selectedCellPos;
        if (!attackerPos) return false;
        let target = getUnitAt(targetX, targetY);
        if (!target || target.owner === attacker.owner) return false;
        if (!isValidAttackRange(attacker, targetX, targetY, attackerPos.x, attackerPos.y)) {
            addLog("Цель вне радиуса атаки");
            return false;
        }
        let forced = getForcedTarget(attacker, attackerPos.x, attackerPos.y);
        if (forced && forced !== target) { addLog("Вы обязаны атаковать ближайшего врага!"); return false; }
        let dmg = attacker.attack + attacker.buffAttack;
        let finalDmg = target.takeDamage(dmg);
        addLog(`${ARCH[attacker.archetype].name} атакует ${ARCH[target.archetype].name} на ${finalDmg} урона`);
        if (attacker.role === 'vampire') {
            let healAmt = Math.floor(finalDmg * 0.5);
            attacker.heal(healAmt);
            addLog(`${ARCH[attacker.archetype].name} восстанавливает ${healAmt} HP`);
        }
        return true;
    }

    // Проверка смерти и стен/ловушек
    function checkDeathAndSync() {
        for (let i=0;i<5;i++) for(let j=0;j<5;j++) {
            let u = getUnitAt(i,j);
            if (u && !u.alive) {
                if (u.owner === 'p1') state.players.p1.placementMap[i][j] = null;
                else state.players.p2.placementMap[i][j] = null;
            }
        }
        state.battleUnits.walls = state.battleUnits.walls.filter(w => w.hp > 0);
        // проверка победы
        let p1Alive = state.battleUnits.p1Units.some(u => u.alive);
        let p2Alive = state.battleUnits.p2Units.some(u => u.alive);
        let p1KingAlive = state.battleUnits.p1King && state.battleUnits.p1King.alive;
        let p2KingAlive = state.battleUnits.p2King && state.battleUnits.p2King.alive;
        if ((!p1Alive || !p1KingAlive)) { addLog(`🏆 ${state.players.p2.nick} ПОБЕДИЛ!`); resetToLobby(); return; }
        if ((!p2Alive || !p2KingAlive)) { addLog(`🏆 ${state.players.p1.nick} ПОБЕДИЛ!`); resetToLobby(); return; }
        sendSync();
    }

    // ---------- МУЛЬТИПЛЕЕР ----------
    function sendSync() { if (state.conn && state.conn.open) state.conn.send({ type: "sync", data: serializeState() }); }
    function serializeState() {
        return {
            players: state.players,
            turn: state.turn,
            battleUnits: {
                p1Units: state.battleUnits.p1Units.map(u => ({...u})),
                p2Units: state.battleUnits.p2Units.map(u => ({...u})),
                p1King: state.battleUnits.p1King ? {...state.battleUnits.p1King} : null,
                p2King: state.battleUnits.p2King ? {...state.battleUnits.p2King} : null,
                walls: state.battleUnits.walls,
                traps: state.battleUnits.traps
            }
        };
    }
    function reviveUnit(data) { if (!data) return null; let u = new Unit(data.archetype, data.owner, 0); Object.assign(u, data); return u; }
    function deserializeState(data) {
        state.players = data.players;
        state.turn = data.turn;
        state.battleUnits.p1Units = data.battleUnits.p1Units.map(u => reviveUnit(u));
        state.battleUnits.p2Units = data.battleUnits.p2Units.map(u => reviveUnit(u));
        state.battleUnits.p1King = reviveUnit(data.battleUnits.p1King);
        state.battleUnits.p2King = reviveUnit(data.battleUnits.p2King);
        state.battleUnits.walls = data.battleUnits.walls;
        state.battleUnits.traps = data.battleUnits.traps;
    }

    function applyRemoteAction(action) {
        if (state.turn !== (state.myPlayerId === 'p1' ? 'p2' : 'p1')) return;
        let attacker = getUnitAt(action.attackerX, action.attackerY);
        if (!attacker) return;
        state.selectedCellPos = { x: action.attackerX, y: action.attackerY };
        if (action.type === "attack") {
            performAttack(attacker, action.targetX, action.targetY);
        } else if (action.type === "skill") {
            useAbility(attacker, action.targetX, action.targetY, action.slot);
        }
        state.selectedCellPos = null;
        checkDeathAndSync();
        state.turn = (state.turn === 'p1') ? 'p2' : 'p1';
        sendSync();
        renderBattle();
    }

    // ---------- ОТРИСОВКА ЭТАПОВ (сокращённо, но полнофункционально) ----------
    function render() {
        if (state.phase === "lobby") renderLobby();
        else if (state.phase === "pickCards") renderPickCards();
        else if (state.phase === "placement") renderPlacement();
        else if (state.phase === "battle") renderBattle();
    }

    function renderLobby() { /* стандартное лобби с созданием/подключением */ 
        root.innerHTML = `<div class="debug-panel"><span>🎮 КАРТОЧНАЯ ВОЙНА</span></div>
        <input id="nick" placeholder="Ваш ник"><br>
        <button id="create">✨ СОЗДАТЬ КОМНАТУ</button>
        <input id="roomId" placeholder="ID комнаты"><button id="join">🔗 ПОДКЛЮЧИТЬСЯ</button>
        <div class="log-area" id="debugLog"></div>`;
        document.getElementById("create")?.addEventListener("click", () => { let nick = document.getElementById("nick").value.trim(); if(!nick) return; state.myNick = nick; let peer = new Peer(); peer.on("open", id => { state.peer = peer; state.roomId = id; addLog(`Комната создана: ${id}`); peer.on("connection", conn => { setupConnection(conn, true); }); }); });
        document.getElementById("join")?.addEventListener("click", () => { let nick = document.getElementById("nick").value.trim(); let rid = document.getElementById("roomId").value.trim(); if(!nick || !rid) return; state.myNick = nick; let peer = new Peer(); peer.on("open", () => { let conn = peer.connect(rid); setupConnection(conn, false); }); });
    }

    function setupConnection(conn, isHost) {
        state.conn = conn;
        state.myPlayerId = isHost ? "p1" : "p2";
        state.players[state.myPlayerId].nick = state.myNick;
        conn.on("open", () => { state.phase = "pickCards"; render(); });
        conn.on("data", (data) => {
            if (data.type === "sync") deserializeState(data.data);
            else if (data.type === "action") applyRemoteAction(data.action);
            else if (data.type === "log") addLog(data.msg, false);
            else if (data.type === "ready") { state.players[data.playerId].ready = true; if (state.players.p1.ready && state.players.p2.ready) startPlacementPhase(); }
            else if (data.type === "placement") { state.players[data.playerId].placementMap = data.map; if (bothPlacementReady()) startBattle(); }
            render();
        });
        if (!isHost) conn.send({ type: "init", nick: state.myNick });
    }

    function startPlacementPhase() { state.phase = "placement"; render(); }
    function bothPlacementReady() { return state.players.p1.placementMap.flat().some(u=>u) && state.players.p2.placementMap.flat().some(u=>u); }
    function startBattle() {
        state.battleUnits.p1Units = state.players.p1.placementMap.flat().filter(u=>u);
        state.battleUnits.p2Units = state.players.p2.placementMap.flat().filter(u=>u);
        state.battleUnits.p1King = new Unit(state.players.p1.king.archetype, "p1", "king");
        state.battleUnits.p2King = new Unit(state.players.p2.king.archetype, "p2", "king");
        state.battleUnits.p1King.hp = 40; state.battleUnits.p1King.baseHp = 40;
        state.battleUnits.p2King.hp = 40; state.battleUnits.p2King.baseHp = 40;
        state.turn = "p1";
        state.phase = "battle";
        render();
    }

    function renderPickCards() { /* выбор короля и бойцов */ root.innerHTML = `<div><h2>Выберите короля</h2><div id="kingGrid"></div><h2>Выберите 3 бойцов</h2><div id="fighterGrid"></div><button id="readyBtn">Готов</button><div class="log-area" id="debugLog"></div></div>`;
        let kingDiv = document.getElementById("kingGrid"); let fighterDiv = document.getElementById("fighterGrid");
        for (let key of Object.keys(ARCH)) {
            let card = document.createElement("div"); card.className = "hero-card"; if (state.players[state.myPlayerId].king?.archetype === key) card.classList.add("selected");
            card.innerHTML = `<img src="${ARCH[key].img}"><div class="hero-name">👑 ${ARCH[key].name}</div><div class="hero-desc">${KING_PASSIVES[key].desc}</div>`;
            card.onclick = () => { state.players[state.myPlayerId].king = { archetype: key, ...KING_PASSIVES[key] }; renderPickCards(); };
            kingDiv.appendChild(card);
            let fcard = document.createElement("div"); fcard.className = "hero-card"; if (state.players[state.myPlayerId].fighters.some(f=>f.archetype===key)) fcard.classList.add("selected");
            fcard.innerHTML = `<img src="${ARCH[key].img}"><div class="hero-name">${ARCH[key].name}</div><div class="hero-desc">❤️${ARCH[key].hp} ⚔️${ARCH[key].attack}<br>${ARCH[key].skillQ} / ${ARCH[key].skillE}</div>`;
            fcard.onclick = () => { let arr = state.players[state.myPlayerId].fighters; if (arr.some(f=>f.archetype===key)) arr = arr.filter(f=>f.archetype!==key); else if (arr.length<3) arr.push({ archetype: key, ...ARCH[key] }); state.players[state.myPlayerId].fighters = arr; renderPickCards(); };
            fighterDiv.appendChild(fcard);
        }
        document.getElementById("readyBtn")?.addEventListener("click", () => { if (!state.players[state.myPlayerId].king || state.players[state.myPlayerId].fighters.length!==3) return; state.players[state.myPlayerId].ready = true; state.conn.send({ type: "ready", playerId: state.myPlayerId }); if (state.players.p1.ready && state.players.p2.ready) startPlacementPhase(); });
    }

    function renderPlacement() { let myMap = state.players[state.myPlayerId].placementMap; let isP1 = state.myPlayerId === 'p1'; let rows = isP1 ? [0,1] : [3,4]; root.innerHTML = `<div class="field-grid" id="placementGrid"></div><button id="donePlace">Готово</button><div class="log-area" id="debugLog"></div>`;
        let grid = document.getElementById("placementGrid");
        for (let i=0;i<5;i++) for(let j=0;j<5;j++) { let cell = document.createElement("div"); cell.className = "cell"; let unit = myMap[i][j]; if (unit) cell.innerHTML = `${ARCH[unit.archetype].name}<br>❤️${unit.hp}`; else cell.innerHTML = "⬚"; if (rows.includes(i) && !unit) cell.onclick = () => { let toPlace = state.players[state.myPlayerId].fighters.find(f => !myMap.flat().some(cell => cell === f)); if (toPlace) { myMap[i][j] = new Unit(toPlace.archetype, state.myPlayerId, "fighter"); renderPlacement(); } }; grid.appendChild(cell); }
        document.getElementById("donePlace")?.addEventListener("click", () => { if (myMap.flat().filter(u=>u).length === 3) { state.conn.send({ type: "placement", playerId: state.myPlayerId, map: myMap }); if (bothPlacementReady()) startBattle(); } else addLog("Разместите 3 бойцов в своей зоне"); });
    }

    function renderBattle() { let isMyTurn = (state.turn === state.myPlayerId); let gridHtml = `<div class="turn-indicator">${isMyTurn ? "ВАШ ХОД" : "ХОД СОПЕРНИКА"}</div><div class="king-panel"><span>👑 ${state.players.p1.nick}: ❤️ ${state.battleUnits.p1King?.hp||0}</span><span>👑 ${state.players.p2.nick}: ❤️ ${state.battleUnits.p2King?.hp||0}</span></div><div class="field-grid" id="battleGrid"></div><div id="actionPanel" class="action-bar"></div><div class="log-area" id="debugLog"></div>`;
        root.innerHTML = gridHtml;
        let gridDiv = document.getElementById("battleGrid");
        for (let i=0;i<5;i++) for(let j=0;j<5;j++) {
            let cell = document.createElement("div"); cell.className = "cell"; let unit = getUnitAt(i,j); let wall = getWallAt(i,j); let trap = getTrapAt(i,j);
            if (unit) { cell.classList.add(`owner-${unit.owner === 'p1' ? 0 : 1}`); cell.innerHTML = `${ARCH[unit.archetype].name}<br>❤️${unit.hp}`; if (unit.stunned) cell.innerHTML += "<br>💫"; }
            else if (wall) { cell.classList.add("wall-cell"); cell.innerHTML = `🧱${wall.hp}`; }
            else if (trap && trap.owner !== state.myPlayerId) cell.innerHTML = "⚠️";
            else cell.innerHTML = "⬚";
            if (state.selectedCellPos && state.selectedCellPos.x === i && state.selectedCellPos.y === j) cell.classList.add("selected-unit");
            if (state.targetCellPos && state.targetCellPos.x === i && state.targetCellPos.y === j) cell.classList.add("target-highlight");
            cell.onclick = () => { if (!isMyTurn) return; let u = getUnitAt(i,j); if (u && u.owner === state.myPlayerId) { state.selectedCellPos = {x:i,y:j}; state.targetCellPos = null; renderBattle(); } else if (state.selectedCellPos) { state.targetCellPos = {x:i,y:j}; renderBattle(); } };
            gridDiv.appendChild(cell);
        }
        let actionDiv = document.getElementById("actionPanel");
        if (isMyTurn && state.selectedCellPos) {
            let attacker = getUnitAt(state.selectedCellPos.x, state.selectedCellPos.y);
            if (attacker && attacker.alive && !attacker.stunned) {
                actionDiv.innerHTML = `<button id="attackBtn">⚔️ АТАКА</button><button id="skillQBtn" class="skill-btn ${attacker.cooldownQ>0?'cooldown':''}" ${attacker.cooldownQ>0?`data-cd="${attacker.cooldownQ}"`:''}>🔮 Q: ${ARCH[attacker.archetype].skillQ}</button><button id="skillEBtn" class="skill-btn ${attacker.cooldownE>0?'cooldown':''}" ${attacker.cooldownE>0?`data-cd="${attacker.cooldownE}"`:''}>🎧 E: ${ARCH[attacker.archetype].skillE}</button><button id="endTurnBtn">⏭️ ЗАВЕРШИТЬ ХОД</button>`;
                document.getElementById("attackBtn")?.addEventListener("click", () => { if (state.targetCellPos) { let success = performAttack(attacker, state.targetCellPos.x, state.targetCellPos.y); if (success) { state.conn.send({ type: "action", action: { type:"attack", attackerX:state.selectedCellPos.x, attackerY:state.selectedCellPos.y, targetX:state.targetCellPos.x, targetY:state.targetCellPos.y } }); checkDeathAndSync(); state.selectedCellPos = null; state.targetCellPos = null; renderBattle(); } } });
                document.getElementById("skillQBtn")?.addEventListener("click", () => { if (state.targetCellPos) { let success = useAbility(attacker, state.targetCellPos.x, state.targetCellPos.y, "Q"); if (success) { state.conn.send({ type: "action", action: { type:"skill", slot:"Q", attackerX:state.selectedCellPos.x, attackerY:state.selectedCellPos.y, targetX:state.targetCellPos.x, targetY:state.targetCellPos.y } }); checkDeathAndSync(); state.selectedCellPos = null; state.targetCellPos = null; renderBattle(); } } });
                document.getElementById("skillEBtn")?.addEventListener("click", () => { if (state.targetCellPos) { let success = useAbility(attacker, state.targetCellPos.x, state.targetCellPos.y, "E"); if (success) { state.conn.send({ type: "action", action: { type:"skill", slot:"E", attackerX:state.selectedCellPos.x, attackerY:state.selectedCellPos.y, targetX:state.targetCellPos.x, targetY:state.targetCellPos.y } }); checkDeathAndSync(); state.selectedCellPos = null; state.targetCellPos = null; renderBattle(); } } });
                document.getElementById("endTurnBtn")?.addEventListener("click", () => { for (let u of state.battleUnits.p1Units) u.reduceCooldowns(); for (let u of state.battleUnits.p2Units) u.reduceCooldowns(); state.turn = (state.turn === 'p1') ? 'p2' : 'p1'; sendSync(); renderBattle(); });
            } else actionDiv.innerHTML = `<span>Выберите живого неоглушённого бойца</span>`;
        } else if (isMyTurn && !state.selectedCellPos) actionDiv.innerHTML = `<span>Кликните по своему бойцу</span>`;
        renderLog();
    }

    function resetToLobby() { state.phase = "lobby"; state.players.p1.ready = false; state.players.p2.ready = false; state.players.p1.placementMap = Array(5).fill().map(()=>Array(5).fill(null)); state.players.p2.placementMap = Array(5).fill().map(()=>Array(5).fill(null)); state.battleUnits = { p1Units:[], p2Units:[], p1King:null, p2King:null, walls:[], traps:[] }; render(); }

    render();
</script>
</body>
</html>
